<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quỹ Tín Dụng Nhân Dân Bình Nguyên · Cổng khách hàng</title>
<meta name="description" content="Cổng tra cứu khoản vay & yêu cầu tư vấn dành cho khách hàng Quỹ Tín Dụng Nhân Dân Bình Nguyên.">
<meta name="theme-color" content="#0f6f61">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<!-- Icon chính thức hệ thống Quỹ Tín dụng Nhân dân (PCF) — file PNG thật
     (không phải data URI): nhiều công cụ đóng gói app Android (VD:
     PWABuilder) và iOS Safari "Thêm vào MH chính" cần file ảnh thật.
     Xem docs/dong-goi-android.md -->
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- Font Inter (nhãn nhỏ, số trong bảng) và Source Serif 4 (tiêu đề, tên mục, số lớn — chữ có chân, số đều hàng trên mọi máy). display=swap nên không chặn hiển thị, lỗi mạng thì tự dùng font hệ thống. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<!-- Kết nối Supabase (thay dần localStorage) — CDN ESM, giữ đúng kiến trúc
     "0 dependency, không cần build" của app: xem docs/supabase-migration.md -->
<script type="importmap">
{ "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
</script>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#667069;font-family:sans-serif">Đang tải ứng dụng...</div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
